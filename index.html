<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>단백질 트래커</title>

  <!-- 웹앱 및 모바일 환경 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="단백질트래커">
  <meta name="application-name" content="단백질트래커">
  <meta name="theme-color" content="#f1f5f9">

  <!-- 전용 아이콘 연결 -->
  <link rel="apple-touch-icon" href="./protein-icon.png">
  <link rel="icon" type="image/png" href="./protein-icon.png">

  <!-- 폰트 불러오기 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --text-muted: #94a3b8;
      --border-soft: #e2e8f0;
      --primary: #2563eb;
      --radius-lg: 24px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 24px 16px 50px;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.45;
    }

    /* 상단 헤더 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
      padding: 0 4px;
    }

    .header-left h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.7px;
      color: #0f172a;
    }

    .header-left p {
      font-size: 13px;
      color: var(--text-sub);
      font-weight: 500;
      margin-top: 2px;
    }

    .date-badge {
      background: #ffffff;
      color: #1e40af;
      font-size: 13px;
      font-weight: 800;
      padding: 7px 14px;
      border-radius: 20px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
      border: 1px solid #cbd5e1;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    /* 메인 대시보드 */
    .dashboard-card {
      background: #ffffff;
      border-radius: var(--radius-lg);
      padding: 26px 22px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05), 0 4px 6px -2px rgba(15, 23, 42, 0.02);
      border: 1px solid rgba(226, 232, 240, 0.8);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .dash-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }

    .dash-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .target-change-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      border-radius: 12px;
      padding: 5px 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      transition: background 0.2s;
    }

    .target-change-btn:active {
      background: #e2e8f0;
    }

    .dash-main {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 8px;
    }

    .current-val {
      font-size: 54px;
      font-weight: 900;
      letter-spacing: -1.5px;
      color: #0f172a;
      line-height: 1;
    }

    .unit-text {
      font-size: 26px;
      font-weight: 800;
      color: #2563eb;
      margin-left: 2px;
    }

    .goal-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-sub);
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 20px;
    }

    .goal-badge {
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 8px;
      font-size: 12px;
    }

    /* 진행률 게이지 */
    .progress-container {
      position: relative;
      width: 100%;
      height: 16px;
      background: #e2e8f0;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #3b82f6 0%, #1d4ed8 100%);
      border-radius: 12px;
      transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.35);
    }

    .progress-footer {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 700;
    }

    .remain-text {
      color: #64748b;
    }

    .percent-text {
      color: #2563eb;
      font-weight: 900;
    }

    /* 섹션 공통 헤더 */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #0f172a;
    }

    .section-hint {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* 12개 간편 계산 그리드 (심플하고 깔끔한 통일 디자인) */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 24px;
    }

    .quick-btn {
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 14px 6px;
      text-align: center;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
      border: 1px solid var(--border-soft);
      transition: transform 0.12s ease, border-color 0.15s, background-color 0.15s;
      touch-action: manipulation;
    }

    .quick-btn:active {
      transform: scale(0.95);
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .quick-name {
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      letter-spacing: -0.3px;
    }

    /* 통일된 깔끔한 블루-슬레이트 톤 뱃지 */
    .quick-val {
      font-size: 14px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      background: #f1f5f9;
      color: #2563eb;
      display: inline-block;
      line-height: 1.2;
    }

    /* 직접 음식 입력 카드 */
    .input-card {
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
      border: 1px solid var(--border-soft);
      margin-bottom: 24px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-field {
      width: 100%;
      background: #f8fafc;
      border: 1.5px solid #cbd5e1;
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }

    .input-field::placeholder {
      color: #94a3b8;
      font-weight: 500;
    }

    .input-field:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .add-btn {
      width: 100%;
      background: #0f172a;
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.15);
      transition: transform 0.1s, background 0.15s;
    }

    .add-btn:active {
      transform: scale(0.98);
      background: #1e293b;
    }

    /* 오늘의 섭취 내역 */
    .history-card {
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 12px 16px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.03);
      border: 1px solid var(--border-soft);
      min-height: 80px;
    }

    /* 전체 삭제 버튼 */
    .clear-all-btn {
      background: #fee2e2;
      border: 1px solid #fecaca;
      color: #dc2626;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 10px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }

    .clear-all-btn:active {
      background: #fca5a5;
    }

    .history-empty {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      padding: 28px 0;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 4px;
      border-bottom: 1px solid #f1f5f9;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .item-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-name {
      font-size: 14px;
      font-weight: 700;
      color: #1e293b;
    }

    .item-time {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .item-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .item-amount {
      font-size: 15px;
      font-weight: 900;
      color: #2563eb;
    }

    .item-del-btn {
      background: #f1f5f9;
      border: none;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 700;
      padding: 5px 8px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .item-del-btn:hover {
      background: #fee2e2;
      color: #ef4444;
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <div class="header">
    <div class="header-left">
      <h1>단백질 트래커</h1>
      <p>오늘의 영양 균형 채우기</p>
    </div>
    <div class="date-badge" id="dateBadge">🗓️ 오늘</div>
  </div>

  <!-- 대시보드 카드 -->
  <div class="dashboard-card">
    <div class="dash-top">
      <span class="dash-label">Today's Intake</span>
      <button type="button" class="target-change-btn" onclick="changeTarget()">⚙️ 목표 <span id="targetAmountDisplay">70</span>g 변경</button>
    </div>

    <div class="dash-main">
      <span class="current-val" id="currentAmount">0</span>
      <span class="unit-text">g</span>
    </div>

    <div class="goal-text">
      목표 <b id="targetAmount">70</b>g 중 <span class="goal-badge" id="statusBadge">시작 전</span>
    </div>

    <!-- 진행률 게이지 -->
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="progress-footer">
      <span class="remain-text" id="remainText">남은 양: 70.0g</span>
      <span class="percent-text" id="percentText">0%</span>
    </div>
  </div>

  <!-- 간편 계산 메뉴 (심플하게 통일된 디자인) -->
  <div class="section-header">
    <span class="section-title">간편 계산</span>
    <span class="section-hint">터치 시 즉시 합산</span>
  </div>
  <div class="quick-grid">
    <button type="button" class="quick-btn" onclick="addProtein('밀키트', 15)">
      <span class="quick-name">밀키트</span>
      <span class="quick-val">+15g</span>
    </button>
    <button type="button" class="quick-btn" onclick="addProtein('치즈빵', 5)">
      <span class="quick-name">치즈빵</span>
      <span class="quick-val">+5g</span>
    </button>
    <button type="button" class="quick-btn" onclick="addProtein('불고기', 20)">
      <span class="quick-name">불고기</span>
      <span class="quick-val">+20g</span>
    </button>

    <button type="button" class="quick-btn" onclick="addProtein('닭가슴살 1조각', 23)">
      <span class="quick-name">닭가슴살 1조각</span>
      <span class="quick-val">+23g</span>
    </button>
    <button type="button" class="quick-btn" onclick="addProtein('프로틴 1팩', 20)">
      <span class="quick-name">프로틴 1팩</span>
      <span class="quick-val">+20g</span>
    </button>
    <button type="button" class="quick-btn" onclick="addProtein('두부 반 모', 10)">
      <span class="quick-name">두부 반 모</span>
      <span class="quick-val">+10g</span>
    </button>

    <button type="button" class="quick-btn" onclick="addProtein('달걀 1개', 6.5)">
      <span class="quick-name">달걀 1개</span>
      <span class="quick-val">+6.5g</span>
    </button>
    <button type="button" class="quick-btn" onclick="addProtein('치킨너겟 1개', 2.4)">
      <span class="quick-name">치킨너겟 1개</span>
      <span class="quick-val">+2.4g</span>
    </button>
    <button type="button" class="quick-btn" onclick="addProtein('볶은 콩 1주먹', 9.5)">
      <span class="quick-name">볶은 콩 1주먹</span>
      <span class="quick-val">+9.5g</span>
    </button>

    <button type="button" class="quick-btn" onclick="addProtein('호두 한 줌', 4.3)">
      <span class="quick-name">호두 한 줌</span>
      <span class="quick-val">+4.3g</span>
    </button>
    <button type="button" class="quick-btn" onclick="addProtein('크래미 1개', 1.6)">
      <span class="quick-name">크래미 1개</span>
      <span class="quick-val">+1.6g</span>
    </button>
    <button type="button" class="quick-btn" onclick="addProtein('유부 1장', 1.4)">
      <span class="quick-name">유부 1장</span>
      <span class="quick-val">+1.4g</span>
    </button>
  </div>

  <!-- 직접 음식 입력 -->
  <div class="section-header">
    <span class="section-title">직접 음식 입력</span>
  </div>
  <div class="input-card">
    <div class="input-row">
      <input type="text" id="customName" class="input-field" placeholder="음식명 (예: 소고기)">
      <input type="number" id="customAmount" class="input-field" placeholder="단백질 g" step="0.1">
    </div>
    <button type="button" class="add-btn" onclick="addCustom()">기록 추가하기</button>
  </div>

  <!-- 오늘의 섭취 내역 (전체 삭제 버튼 추가) -->
  <div class="section-header">
    <span class="section-title">오늘의 섭취 내역</span>
    <button type="button" class="clear-all-btn" id="clearAllBtn" onclick="clearAllHistory()">🗑️ 전체 기록 삭제</button>
  </div>
  <div class="history-card" id="historyList">
    <div class="history-empty">오늘 기록된 단백질 섭취 내역이 없습니다.</div>
  </div>

  <script>
    const todayKey = new Date().toISOString().slice(0, 10);

    // 날짜 헤더 표시
    const now = new Date();
    const days = ['일', '월', '화', '수', '목', '금', '토'];
    document.getElementById('dateBadge').innerText = `${now.getMonth() + 1}월 ${now.getDate()}일 (${days[now.getDay()]})`;

    let target = parseFloat(localStorage.getItem('protein_target') || '70');
    let history = JSON.parse(localStorage.getItem('protein_history_' + todayKey) || '[]');

    function updateUI() {
      document.getElementById('targetAmount').innerText = target;
      document.getElementById('targetAmountDisplay').innerText = target;
      
      const total = history.reduce((sum, item) => sum + item.amount, 0);
      const roundedTotal = Math.round(total * 10) / 10;
      document.getElementById('currentAmount').innerText = roundedTotal;

      const pct = Math.min(100, Math.round((total / target) * 100));
      document.getElementById('percentText').innerText = `${pct}%`;
      document.getElementById('progressBar').style.width = `${pct}%`;

      const remain = Math.max(0, Math.round((target - total) * 10) / 10);
      document.getElementById('remainText').innerText = remain === 0 ? "🎉 목표 달성 완료!" : `남은 양: ${remain}g`;

      const statusBadge = document.getElementById('statusBadge');
      if (pct >= 100) {
        statusBadge.innerText = '목표 달성!';
        statusBadge.style.background = '#dcfce7';
        statusBadge.style.color = '#15803d';
      } else if (pct >= 50) {
        statusBadge.innerText = '절반 달성';
        statusBadge.style.background = '#fef9c3';
        statusBadge.style.color = '#854d0e';
      } else {
        statusBadge.innerText = '달성 중';
        statusBadge.style.background = '#eff6ff';
        statusBadge.style.color = '#1d4ed8';
      }

      // 내역 유무에 따른 전체 삭제 버튼 표시
      const clearBtn = document.getElementById('clearAllBtn');
      if (clearBtn) {
        clearBtn.style.display = history.length > 0 ? 'inline-flex' : 'none';
      }

      const listEl = document.getElementById('historyList');
      if (history.length === 0) {
        listEl.innerHTML = '<div class="history-empty">오늘 기록된 단백질 섭취 내역이 없습니다.</div>';
      } else {
        listEl.innerHTML = history.map((item, idx) => {
          const itemTime = item.time ? new Date(item.time) : null;
          const timeStr = itemTime ? `${String(itemTime.getHours()).padStart(2, '0')}:${String(itemTime.getMinutes()).padStart(2, '0')}` : '';
          return `
            <div class="history-item">
              <div class="item-left">
                <span class="item-name">${item.name}</span>
                ${timeStr ? `<span class="item-time">${timeStr} 기록</span>` : ''}
              </div>
              <div class="item-right">
                <span class="item-amount">+${item.amount}g</span>
                <button class="item-del-btn" onclick="deleteItem(${idx})">삭제</button>
              </div>
            </div>
          `;
        }).reverse().join('');
      }
    }

    function addProtein(name, amount) {
      history.push({ name, amount: parseFloat(amount), time: Date.now() });
      localStorage.setItem('protein_history_' + todayKey, JSON.stringify(history));
      updateUI();
    }

    function addCustom() {
      const nameInput = document.getElementById('customName');
      const valInput = document.getElementById('customAmount');
      const amount = parseFloat(valInput.value);

      if (isNaN(amount) || amount <= 0) {
        alert('단백질 함량(g)을 올바르게 입력해주세요.');
        return;
      }

      const name = nameInput.value.trim() || '직접 입력';
      addProtein(name, amount);

      nameInput.value = '';
      valInput.value = '';
    }

    function deleteItem(index) {
      const realIndex = history.length - 1 - index;
      history.splice(realIndex, 1);
      localStorage.setItem('protein_history_' + todayKey, JSON.stringify(history));
      updateUI();
    }

    // 전체 기록 한 번에 삭제
    function clearAllHistory() {
      if (confirm('오늘 기록된 모든 단백질 섭취 내역을 삭제하시겠습니까?')) {
        history = [];
        localStorage.removeItem('protein_history_' + todayKey);
        updateUI();
      }
    }

    function changeTarget() {
      const newTarget = prompt('새로운 하루 목표 단백질량(g)을 입력하세요:', target);
      if (newTarget && !isNaN(parseFloat(newTarget)) && parseFloat(newTarget) > 0) {
        target = parseFloat(newTarget);
        localStorage.setItem('protein_target', target);
        updateUI();
      }
    }

    updateUI();
  </script>
</body>
</html>
