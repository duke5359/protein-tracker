  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --text-muted: #94a3b8;
      --border: #e2e8f0;
      --primary: #2563eb;
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      padding: 20px 16px 40px;
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.4;
    }

    /* 상단 헤더 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .date-badge {
      background: #eff6ff;
      color: #2563eb;
      font-size: 13px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #bfdbfe;
    }

    /* 대시보드 카드 */
    .dashboard-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 26px 20px 20px;
      text-align: center;
      box-shadow: 0 4px 16px rgba(148, 163, 184, 0.08);
      border: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .current-val {
      font-size: 46px;
      font-weight: 800;
      color: #1e3a8a;
      line-height: 1;
      margin-bottom: 8px;
    }

    .current-val span {
      font-size: 24px;
      font-weight: 700;
      color: #3b82f6;
      margin-left: 2px;
    }

    .target-desc {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 16px;
    }

    /* 프로그레스 바 */
    .progress-track {
      width: 100%;
      height: 14px;
      background: #f1f5f9;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }
